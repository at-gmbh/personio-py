name: release

on:
  push:
    tags:
    # Push events to matching 'v*', i.e. 'v1.0', 'v20.15.10b5'
    - 'v*'

jobs:
  release:
    name: Deploy on TestPyPI & Create Draft Release
    runs-on: ubuntu-latest
    permissions:
      # required to create the draft release
      contents: write
    steps:
      # checkout & build
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Poetry
      run: pipx install poetry
    - name: Check that the tag matches the package version
      run: |
        if [ "${GITHUB_REF_NAME#v}" != "$(poetry version --short)" ]; then
          echo "::error::tag ${GITHUB_REF_NAME} does not match version $(poetry version --short) in pyproject.toml"
          exit 1
        fi
    - name: Build distribution packages (sdist & wheel)
      run: |
        poetry build
      # release on TestPyPI (for release on regular PyPI, see deploy.yml)
    - name: Publish Package to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TEST_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        # allows re-running this workflow if a later step failed
        skip-existing: true
      # create a new draft release with the built packages attached
      # (so we only trigger the deployment pipeline after the draft has been published)
    - name: Create Draft Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --draft \
          --verify-tag \
          --title "Release $GITHUB_REF_NAME"
