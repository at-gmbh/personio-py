name: build

on:
  push:
    branches:
    - master
    paths-ignore:
    - 'docs/**'
    - '*.md'
  pull_request:
    branches:
    - master
    paths-ignore:
    - 'docs/**'
    - '*.md'

jobs:

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run pre-commit hooks
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
        pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
        os: [ubuntu-latest, windows-latest]
    name: Test & Build (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    - name: Install dependencies
      run: |
        # upgrade pip, install pytest (for testing), responses (test mocks), wheel (for packaging) and the personio-py package
        python -m pip install --upgrade pip
        pip install pytest responses wheel
        pip install -r requirements.txt
        pip install .
    - name: Test with pytest
      run: |
        pytest tests
    - name: Build a distribution package (wheel)
      run: |
        python setup.py sdist bdist_wheel
    - name: Store distribution package
      uses: actions/upload-artifact@v4
      with:
        name: personio-py_${{ matrix.python-version }}_${{ matrix.os }}
        path: dist/
